[package]
name = "astroceleste-engine-wasm"
description = "WebAssembly bindings for astroceleste-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
astroceleste-engine = { path = "../astroceleste-engine", version = "0.0.3" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
