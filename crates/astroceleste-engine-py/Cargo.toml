[package]
name = "astroceleste-engine-py"
description = "Python bindings for astroceleste-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "astroceleste_engine_py"
crate-type = ["cdylib"]

[dependencies]
astroceleste-engine = { path = "../astroceleste-engine", version = "0.0.1" }
pyo3 = { version = "0.29", features = ["abi3-py312", "extension-module"] }
serde = "1"
serde_json = "1"
