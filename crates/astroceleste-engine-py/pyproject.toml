[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "astroceleste-engine"
description = "Astrological chart calculation on JPL ephemerides (Rust, via PyO3)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
keywords = ["astrology", "ephemeris", "jpl", "horoscope"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://astroceleste.it"
Repository = "https://github.com/ffalcinelli/astroceleste-engine"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
module-name = "astroceleste_engine"
