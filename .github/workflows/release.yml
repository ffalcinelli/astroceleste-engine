name: Release

# release-plz keeps a "release PR" open that bumps versions and updates CHANGELOG.md from
# conventional commits. Merging it tags the release, creates the GitHub Release and
# publishes to crates.io through Trusted Publishing (no long-lived token).

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: publish
    if: github.repository_owner == 'ffalcinelli'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release-pr:
    name: release PR
    if: github.repository_owner == 'ffalcinelli'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
        env:
          # PRs opened with GITHUB_TOKEN do not trigger CI. To run CI on the release PR,
          # swap this for a GitHub App or fine-grained token with contents+PR write.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
